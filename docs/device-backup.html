<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNOOT CLUB · 本机作品备份</title><style>body{font:16px system-ui;max-width:600px;margin:12vh auto;padding:24px;background:#fffaf5;color:#333}button{padding:16px 24px;border:1px solid #cba6b2;background:#f9e5ec;border-radius:12px;font:inherit;cursor:pointer}p{line-height:1.8}</style><h1>保存这台设备的作品</h1><p>包含已保存娃娃、创作草稿、评分与点赞记录。不包含登录信息。文件下载到本机，不会上传到其他地方。</p><button id="backup">下载本机完整备份</button><p id="status" role="status"></p><a href="./?v=sitefreeze1#family">返回档案袋</a><script type="module">
const status=document.querySelector('#status');
async function readStore(name,store){return new Promise((resolve,reject)=>{const r=indexedDB.open(name);r.onerror=()=>reject(r.error);r.onsuccess=()=>{const db=r.result;if(!db.objectStoreNames.contains(store)){db.close();resolve([]);return;}const tx=db.transaction(store),s=tx.objectStore(store),values=s.getAll(),keys=s.getAllKeys();tx.oncomplete=()=>{const entries=keys.result.map((key,i)=>({key,value:values.result[i]}));db.close();resolve(entries);};tx.onerror=()=>reject(tx.error);};});}
document.querySelector('#backup').onclick=async()=>{try{status.textContent='正在整理备份…';const family=await readStore('soft-things-family','members'),designs=await readStore('soft-things-designs','designs'),preferences={};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(/^(soft-things-|plush-|snoot-)/.test(key)&&!/session|token|password|auth|admin/i.test(key))preferences[key]=localStorage.getItem(key);}const payload={format:'snoot-device-backup-v1',siteVersion:'sitefreeze1',created:new Date().toISOString(),family,designs,preferences};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='SNOOT-CLUB-device-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent='备份已下载：'+family.length+' 份娃娃档案、'+designs.length+' 份草稿记录。';}catch(e){status.textContent='备份未完成，请保留当前页面：'+e.message;}};
</script></html>
